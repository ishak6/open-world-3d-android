name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Export Godot Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Godot and Android toolchain
        run: |
          godot --version
          java -version
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          mkdir -p build

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Install download tools
        run: |
          apt-get update
          apt-get install -y curl unzip

      - name: Install matching Godot Android export templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -o /tmp/godot_export_templates.tpz
          mkdir -p /tmp/godot_export_templates
          unzip -q /tmp/godot_export_templates.tpz -d /tmp/godot_export_templates
          install -m 0644 /tmp/godot_export_templates/templates/android_source.zip "$TEMPLATE_DIR/android_source.zip"
          install -m 0644 /tmp/godot_export_templates/templates/android_debug.apk "$TEMPLATE_DIR/android_debug.apk"
          install -m 0644 /tmp/godot_export_templates/templates/android_release.apk "$TEMPLATE_DIR/android_release.apk"
          printf "4.4.1.stable" > "$TEMPLATE_DIR/version.txt"
          test -s "$TEMPLATE_DIR/android_source.zip"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Godot Android export
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

      - name: Import project resources
        run: godot --headless --path . --editor --import --quit

      - name: Export Android APK
        run: |
          timeout 20m godot --headless --path . --verbose --export-debug "Android" build/VillageFrontier-debug.apk
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

      - name: Verify APK output
        run: |
          set -eu
          APK="build/VillageFrontier-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -qx "AndroidManifest.xml"
          unzip -Z1 "$APK" | grep -qx "lib/arm64-v8a/libgodot_android.so"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VillageFrontier-Android-debug
          path: build/VillageFrontier-debug.apk
          if-no-files-found: error
          retention-days: 14
